<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eadc" />
    <meta name="description" content="5歳から遊べる、ドレミ表示つきのスマホ向けピアノアプリ" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <title>ドレミピアノ</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">🎹</div>
          <div>
            <p class="eyebrow">はじめての</p>
            <h1>ピアノあそび</h1>
          </div>
          <span class="cat-mascot cat-mascot-header" aria-hidden="true">
            <svg viewBox="0 0 80 64">
              <path class="cat-tail" d="M60 48c12 4 16-9 8-15" />
              <path class="cat-body" d="M24 55c-5-12-3-27 8-34 9-6 23-3 28 8 4 8 1 19-6 26H24Z" />
              <path class="cat-ear" d="M29 23 27 6l13 10M55 17 66 7l-1 19" />
              <path class="cat-face" d="M31 27c7-7 21-7 28 0v13c-6 10-22 10-28 0Z" />
              <circle class="cat-eye" cx="40" cy="33" r="2.2" />
              <circle class="cat-eye" cx="51" cy="33" r="2.2" />
              <path class="cat-nose" d="M45 37l2 2-2 2-2-2Z" />
              <path class="cat-mouth" d="M45 41c-3 4-6 1-7 0M45 41c3 4 6 1 7 0" />
              <path class="cat-whisker" d="M32 38 18 35M32 42 17 44M58 38l13-3M58 42l14 3" />
              <path class="cat-paw" d="M32 53c-2 5-8 5-10 0M54 53c2 5 8 5 10 0" />
            </svg>
          </span>
        </div>
        <button id="soundToggle" class="sound-toggle" type="button" aria-label="音あり" aria-pressed="true" title="音あり">
          <span aria-hidden="true">🔊</span><span class="sound-toggle-label">音</span>
        </button>
      </header>

      <main class="content">
        <section class="mode-card" aria-labelledby="modeTitle">
          <div class="section-heading">
            <div>
              <p class="section-kicker">MENU</p>
              <h2 id="modeTitle">あそぶ</h2>
            </div>
            <span id="rangeLabel" class="range-label">8音であそぶ</span>
          </div>
          <div class="mode-buttons" role="tablist" aria-label="遊び方">
            <button class="mode-button is-active" type="button" data-mode="free" role="tab" aria-selected="true">
              <span class="button-icon" aria-hidden="true">🎹</span>
              <span>ひく</span>
            </button>
            <button class="mode-button" type="button" data-mode="game" role="tab" aria-selected="false">
              <span class="button-icon" aria-hidden="true">⭐</span>
              <span>おとあそび</span>
            </button>
          </div>
          <div class="range-buttons" aria-label="使う音の数">
            <button class="range-button" type="button" data-range="3"><span aria-hidden="true">🌱</span> 3音</button>
            <button class="range-button" type="button" data-range="5">5音</button>
            <button class="range-button is-active" type="button" data-range="8"><span aria-hidden="true">🌈</span> 8音</button>
          </div>
          <div class="song-picker">
            <div class="song-picker-heading">
              <span class="section-kicker">曲</span>
              <span id="selectedSongName" class="selected-song-name">きらきら星</span>
            </div>
            <div class="song-buttons" role="tablist" aria-label="練習する曲">
              <button class="song-button is-active" type="button" data-song="twinkle" role="tab" aria-selected="true">
                <span aria-hidden="true">⭐</span><span>きらきら星</span>
              </button>
              <button class="song-button" type="button" data-song="frog" role="tab" aria-selected="false">
                <span aria-hidden="true">🐸</span><span>かえるの合唱</span>
              </button>
              <button class="song-button" type="button" data-song="mini" role="tab" aria-selected="false">
                <span aria-hidden="true">🎵</span><span>ドレミ</span>
              </button>
            </div>
          </div>
        </section>

        <section class="play-card" aria-labelledby="playTitle">
          <div class="play-header">
            <div>
              <p class="section-kicker">GUIDE</p>
              <h2 id="playTitle">音符ガイド</h2>
            </div>
            <div class="score-board">
              <div id="scorePill" class="score-pill" aria-live="polite">⭐ 0</div>
              <div id="comboPill" class="combo-pill" aria-live="polite">0コンボ</div>
            </div>
          </div>

          <p id="message" class="message" aria-live="polite">鍵盤を押して、音を聞いてみよう</p>

          <div id="fallingLane" class="falling-lane" aria-label="音符が落ちてくる場所">
            <div class="lane-tip" aria-hidden="true">ここに音符がくるよ</div>
            <div class="hit-line" aria-hidden="true"><span>タイミング</span></div>
            <div id="noteCards" class="note-cards" aria-live="polite" aria-label="おす音"></div>
          </div>
        </section>

        <section class="piano-card toy-piano" aria-labelledby="pianoTitle">
          <div class="toy-piano-top" aria-hidden="true">
            <span class="toy-screw toy-screw-left"></span>
            <span class="toy-piano-name">ちいさなピアノ</span>
            <span class="toy-sticker">♡</span>
            <span class="toy-screw toy-screw-right"></span>
          </div>
          <div class="piano-header">
            <div>
              <p class="section-kicker">PIANO</p>
              <h2 id="pianoTitle"><span class="piano-title-icon" aria-hidden="true">🎼</span><span class="piano-title-text">ドレミをひこう</span></h2>
            </div>
            <span class="touch-label">タッチしてね</span>
          </div>
          <div class="piano-tools" aria-label="ピアノの操作">
            <span class="guide-icon" role="img" aria-label="音符ガイド">🎵</span>
            <div class="game-controls">
              <button id="gameStart" class="primary-button icon-control" type="button" aria-label="あそぶ" title="あそぶ"><span aria-hidden="true">▶</span><span class="control-label">あそぶ</span></button>
              <button id="listenSong" class="secondary-button icon-control" type="button" aria-label="きく" title="きく"><span aria-hidden="true">♫</span><span class="control-label">きく</span></button>
              <button id="restartGame" class="secondary-button icon-control" type="button" aria-label="もういちど" title="もういちど"><span aria-hidden="true">↻</span><span class="control-label">もういちど</span></button>
            </div>
          </div>
          <div id="piano" class="piano" aria-label="ドレミピアノの鍵盤"></div>
        </section>
      </main>

      <footer class="footer-note">
        <span>まちがえても だいじょうぶ。たのしく音をさがそう。</span>
        <small class="audio-credit">ピアノ音源：FluidR3_GM（CC BY 3.0）</small>
      </footer>
    </div>
    <script src="./app.js" defer></script>
  </body>
</html>
