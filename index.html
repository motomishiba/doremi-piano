<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8ef" />
    <meta name="description" content="5歳から遊べる、ドレミ表示つきのスマホ向けピアノアプリ" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <title>ドレミピアノ</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">♪</div>
          <div>
            <p class="eyebrow">はじめての</p>
            <h1>ドレミピアノ</h1>
          </div>
        </div>
        <button id="soundToggle" class="sound-toggle" type="button" aria-pressed="true">
          <span aria-hidden="true">🔊</span> 音あり
        </button>
      </header>

      <main class="content">
        <section class="welcome-card" aria-labelledby="welcomeTitle">
          <div>
            <p class="section-kicker">ゆっくりで だいじょうぶ</p>
            <h2 id="welcomeTitle">見えた「ドレミ」を<br />同じ鍵盤でおしてみよう</h2>
          </div>
          <div class="welcome-star" aria-hidden="true">★</div>
        </section>

        <section class="mode-card" aria-labelledby="modeTitle">
          <div class="section-heading">
            <div>
              <p class="section-kicker">あそびかた</p>
              <h2 id="modeTitle">どちらにする？</h2>
            </div>
            <span id="rangeLabel" class="range-label">8音であそぶ</span>
          </div>
          <div class="mode-buttons" role="tablist" aria-label="遊び方">
            <button class="mode-button is-active" type="button" data-mode="free" role="tab" aria-selected="true">
              <span class="button-icon" aria-hidden="true">🎹</span>
              <span>ひいてみる</span>
            </button>
            <button class="mode-button" type="button" data-mode="game" role="tab" aria-selected="false">
              <span class="button-icon" aria-hidden="true">⭐</span>
              <span>音符をおす</span>
            </button>
          </div>
          <div class="range-buttons" aria-label="使う音の数">
            <button class="range-button" type="button" data-range="3">ド・レ・ミ</button>
            <button class="range-button" type="button" data-range="5">5音</button>
            <button class="range-button is-active" type="button" data-range="8">ド〜ド</button>
          </div>
          <div class="song-picker">
            <div class="song-picker-heading">
              <span class="section-kicker">曲をえらぶ</span>
              <span id="selectedSongName" class="selected-song-name">きらきら星</span>
            </div>
            <div class="song-buttons" role="tablist" aria-label="練習する曲">
              <button class="song-button is-active" type="button" data-song="twinkle" role="tab" aria-selected="true">
                <span aria-hidden="true">⭐</span> きらきら星
              </button>
              <button class="song-button" type="button" data-song="frog" role="tab" aria-selected="false">
                <span aria-hidden="true">🐸</span> かえるのうた
              </button>
              <button class="song-button" type="button" data-song="mini" role="tab" aria-selected="false">
                <span aria-hidden="true">🌈</span> ドレミのぼうけん
              </button>
            </div>
          </div>
        </section>

        <section class="play-card" aria-labelledby="playTitle">
          <div class="play-header">
            <div>
              <p class="section-kicker">れんしゅう</p>
              <h2 id="playTitle">音符レーン</h2>
            </div>
            <div class="score-board">
              <div id="scorePill" class="score-pill" aria-live="polite">⭐ 0</div>
              <div id="comboPill" class="combo-pill" aria-live="polite">0コンボ</div>
            </div>
          </div>

          <div id="fallingLane" class="falling-lane" aria-label="音符が落ちてくる場所">
            <div class="lane-tip" aria-hidden="true">ここに音符がくるよ</div>
            <div class="hit-line" aria-hidden="true"><span>ここで おしてね</span></div>
            <div id="noteCard" class="note-card is-hidden" aria-live="polite">
              <strong id="noteText">ド</strong>
              <span>おしてね</span>
            </div>
          </div>

          <p id="message" class="message" aria-live="polite">鍵盤を押して、音を聞いてみよう</p>

          <div class="game-controls">
            <button id="gameStart" class="primary-button" type="button">音符あそびをはじめる</button>
            <button id="listenSong" class="secondary-button" type="button">🎵 きいてみる</button>
            <button id="restartGame" class="secondary-button" type="button">もういちど</button>
          </div>
        </section>

        <section class="piano-card toy-piano" aria-labelledby="pianoTitle">
          <div class="toy-piano-top" aria-hidden="true">
            <span class="toy-screw toy-screw-left"></span>
            <span class="toy-piano-name">ちいさなピアノ</span>
            <span class="toy-sticker">♡</span>
            <span class="toy-screw toy-screw-right"></span>
          </div>
          <div class="piano-header">
            <div>
              <p class="section-kicker">おおきな鍵盤</p>
              <h2 id="pianoTitle">ここをおしてね</h2>
            </div>
            <span class="touch-label">タッチで音が鳴ります</span>
          </div>
          <div id="piano" class="piano" aria-label="ドレミピアノの鍵盤"></div>
        </section>
      </main>

      <footer class="footer-note">まちがえても だいじょうぶ。たのしく音をさがそう。</footer>
    </div>
    <script src="./app.js" defer></script>
  </body>
</html>
